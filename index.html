<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<title>Visita Certa</title>
<style>
:root{--pri:#0f766e;--pri-esc:#0b5a54;--pri-cl:#e6f4f2;--ink:#14211f;--muted:#5d6b69;--line:#dbe5e3;--bg:#f3f6f5;
  --ok:#15803d;--ok-cl:#e8f6ec;--alerta:#b45309;--alerta-cl:#fff4e0;--erro:#b91c1c;--erro-cl:#fdecec;--saida:#c2410c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:14px 16px 12px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca b{font-size:20px;font-weight:900;letter-spacing:.01em}
.marca small{display:block;font-size:13px;opacity:.9;font-weight:600}
.trocar{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:800}
.demo-faixa{background:#fef3c7;color:#7c4a03;font-size:12.5px;font-weight:700;text-align:center;padding:6px 12px}
main{max-width:560px;margin:0 auto;padding:14px 16px 32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:900}
label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:10px 0 6px}
select,input,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:14px;
  font:inherit;font-size:19px;font-weight:900;cursor:pointer;color:#fff;background:var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.saida{background:var(--saida)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:16px;min-height:50px}
.btn + .btn{margin-top:10px}
.gps{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.gps i{width:12px;height:12px;border-radius:50%;background:#9ca3af;flex:none}
.gps.ok i{background:var(--ok)} .gps.busca i{background:#f59e0b;animation:pisca 1s infinite} .gps.erro i{background:var(--erro)}
.gps.erro{color:var(--erro)}
@keyframes pisca{50%{opacity:.3}}
.lojas{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;margin:0 -4px;padding:0 4px}
.loja{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font:inherit;cursor:pointer}
.loja.sel{border-color:var(--pri);background:var(--pri-cl);box-shadow:0 0 0 2px var(--pri) inset}
.loja span{flex:1;min-width:0}
.loja b{display:block;font-size:15.5px}
.loja small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{flex:none;font-size:12.5px;font-weight:900;padding:4px 8px;border-radius:999px;background:#eef1f0;color:var(--muted)}
.dist.perto{background:var(--ok-cl);color:var(--ok)}
.busca{min-height:44px;font-size:15px;margin-bottom:8px}
.emvisita{background:var(--pri);color:#fff;border:0}
.emvisita h2{color:#cdeae6}
.emvisita .loja-nome{font-size:21px;font-weight:900;line-height:1.2}
.emvisita .tempo{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.emvisita .desde{font-size:14px;opacity:.9}
.aviso{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin:10px 0 0}
.aviso.alerta{background:var(--alerta-cl);color:var(--alerta)}
.aviso.erro{background:var(--erro-cl);color:var(--erro)}
.aviso.ok{background:var(--ok-cl);color:var(--ok)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.hist li:first-child{border-top:0}
.hist li span{flex:1;min-width:0}
.hist li b{display:block}
.hist li small{color:var(--muted)}
.hist .dur{font-weight:900;font-variant-numeric:tabular-nums}
.pend{display:inline-block;margin-left:6px;font-size:11px;font-weight:900;color:var(--alerta);background:var(--alerta-cl);border-radius:999px;padding:2px 7px}
.vazio{color:var(--muted);font-size:14px;margin:0}
.fila{background:var(--alerta-cl);color:var(--alerta);font-weight:800;font-size:13.5px;text-align:center;padding:8px;border-radius:12px;margin-bottom:12px}
/* tela da foto */
.folha{position:fixed;inset:0;z-index:20;background:rgba(10,20,18,.6);display:none;align-items:flex-end;justify-content:center}
.folha.aberta{display:flex}
.folha .caixa{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.folha h3{margin:0 0 4px;font-size:19px}
.folha .info{color:var(--muted);font-size:14px;margin:0 0 10px}
.folha img{display:block;width:100%;border-radius:12px;background:#eee}
.carregando{position:fixed;inset:0;z-index:30;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:800}
.carregando.on{display:flex}
.roda{width:44px;height:44px;border:5px solid var(--pri-cl);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;
  max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.toast.on{display:block}
.oculto{display:none!important}
</style>
</head>
<body>
<header>
  <div class="marca">
    <div><b>📍 Visita Certa</b><small id="quem">Registro de visitas</small></div>
    <button type="button" class="trocar oculto" id="btnTrocar">Trocar</button>
  </div>
</header>
<div class="demo-faixa oculto" id="faixaDemo">MODO DEMONSTRAÇÃO — dados de exemplo, PIN 1234</div>

<main>
  <!-- entrar -->
  <section class="card oculto" id="telaLogin">
    <h2>Entrar</h2>
    <label for="selPromotor">Promotor</label>
    <select id="selPromotor"><option value="">Carregando…</option></select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">
    <div style="height:14px"></div>
    <button type="button" class="btn" id="btnEntrar">Entrar</button>
    <div id="msgLogin"></div>
  </section>

  <!-- principal -->
  <div class="oculto" id="telaApp">
    <div class="fila oculto" id="fila"></div>

    <section class="card">
      <div class="gps busca" id="gps"><i></i><span>Buscando sua localização…</span></div>
    </section>

    <section class="card emvisita oculto" id="cardVisita">
      <h2>Em visita</h2>
      <div class="loja-nome" id="vLoja"></div>
      <div class="tempo" id="vTempo">00:00</div>
      <div class="desde" id="vDesde"></div>
      <div style="height:14px"></div>
      <button type="button" class="btn saida" id="btnSaida">🏁 Registrar saída</button>
    </section>

    <section class="card" id="cardLojas">
      <h2>Onde você está?</h2>
      <input class="busca" id="busca" type="search" placeholder="Buscar loja…" autocomplete="off">
      <div class="lojas" id="lojas"></div>
      <button type="button" class="btn sec oculto" id="btnLojaAqui" style="margin-top:10px">➕ Criar loja de teste aqui (demonstração)</button>
      <div style="height:12px"></div>
      <button type="button" class="btn" id="btnEntrada" disabled>📍 Registrar chegada</button>
      <div id="msgLoja"></div>
    </section>

    <section class="card">
      <h2>Hoje</h2>
      <ul class="hist" id="hist"></ul>
    </section>
  </div>
</main>

<input type="file" id="camera" accept="image/*" capture="environment" class="oculto">

<div class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="fTitulo">
  <div class="caixa">
    <h3 id="fTitulo"></h3>
    <p class="info" id="fInfo"></p>
    <img id="fImg" alt="Foto do registro">
    <div id="fAviso"></div>
    <div id="fObsWrap" class="oculto">
      <label for="fObs">Observação (opcional)</label>
      <textarea id="fObs" placeholder="Ex.: gôndola abastecida, faltou produto…"></textarea>
    </div>
    <div style="height:14px"></div>
    <button type="button" class="btn" id="fEnviar">Enviar</button>
    <button type="button" class="btn sec" id="fOutra">📷 Tirar outra foto</button>
    <button type="button" class="btn sec" id="fCancelar">Cancelar</button>
  </div>
</div>
<div class="carregando" id="carregando"><div class="roda"></div><div id="carregandoTxt">Enviando…</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="comum.js"></script>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var LS={promotor:'vc_promotor', cache:'vc_cache', fila:'vc_fila', local:'vc_local'};
var S={promotor:null, lojas:[], promotores:[], fotoSaida:true, pos:null, gpsErro:null, lojaSel:null, aberta:null, hoje:[], modo:null, foto:null, horaFoto:null};

function ler(k,padrao){ try{ var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?padrao:v; }catch(e){ return padrao; } }
function gravar(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function toast(t,ms){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('on'); },ms||3200); }
function carregando(on,txt){ $('carregando').classList.toggle('on',on); if(txt) $('carregandoTxt').textContent=txt; }
function aviso(id,tipo,txt){ $(id).innerHTML=txt?'<div class="aviso '+tipo+'">'+txt+'</div>':''; }
function lojaPorId(id){ return S.lojas.filter(function(l){ return l.id===id; })[0]; }

/* ---------- início ---------- */
if(VC.DEMO) $('faixaDemo').classList.remove('oculto');
S.promotor=ler(LS.promotor,null);
var cache=ler(LS.cache,null);
if(cache){ S.lojas=cache.lojas||[]; S.promotores=cache.promotores||[]; S.fotoSaida=cache.fotoSaida!==false; }
var local=ler(LS.local,null);
if(local && S.promotor && local.promotorId===S.promotor.id){ S.aberta=local.aberta; S.hoje=local.hoje||[]; }

VC.chamar('config').then(function(r){
  if(!r.ok) throw new Error(r.erro||'erro');
  S.lojas=r.lojas||[]; S.promotores=r.promotores||[]; S.fotoSaida=r.fotoSaida!==false;
  gravar(LS.cache,{lojas:S.lojas,promotores:S.promotores,fotoSaida:S.fotoSaida});
  montarLogin(); render();
}).catch(function(){ montarLogin(); render(); if(!S.lojas.length) toast('Sem internet: não consegui carregar as lojas.'); });

function montarLogin(){
  var sel=$('selPromotor');
  sel.innerHTML='<option value="">Escolha seu nome</option>'+S.promotores.map(function(p){ return '<option value="'+VC.esc(p.id)+'">'+VC.esc(p.nome)+'</option>'; }).join('');
}
function telas(){
  var logado=!!S.promotor;
  $('telaLogin').classList.toggle('oculto',logado);
  $('telaApp').classList.toggle('oculto',!logado);
  $('btnTrocar').classList.toggle('oculto',!logado);
  $('quem').textContent=logado?S.promotor.nome:'Registro de visitas';
}
$('btnEntrar').addEventListener('click',function(){
  var id=$('selPromotor').value, pin=$('pin').value.trim();
  if(!id||!pin){ aviso('msgLogin','erro','Escolha seu nome e digite o PIN.'); return; }
  carregando(true,'Entrando…');
  VC.chamar('login',{promotorId:id,pin:pin}).then(function(r){
    carregando(false);
    if(!r.ok){ aviso('msgLogin','erro',VC.esc(r.erro||'Não foi possível entrar.')); return; }
    S.promotor={id:r.promotor.id,nome:r.promotor.nome,pin:pin}; gravar(LS.promotor,S.promotor);
    S.aberta=null; S.hoje=[]; salvarLocal(); aviso('msgLogin');
    atualizarEstado(); render();
  }).catch(function(){ carregando(false); aviso('msgLogin','erro','Sem internet. Tente de novo.'); });
});
$('btnTrocar').addEventListener('click',function(){
  if(ler(LS.fila,[]).length){ toast('Ainda há registros esperando internet. Troque depois que enviarem.'); return; }
  if(!confirm('Sair e entrar com outro promotor?')) return;
  S.promotor=null; S.aberta=null; S.hoje=[]; localStorage.removeItem(LS.promotor); localStorage.removeItem(LS.local); $('pin').value=''; render();
});

function salvarLocal(){ if(S.promotor) gravar(LS.local,{promotorId:S.promotor.id,data:VC.hojeStr(),aberta:S.aberta,hoje:S.hoje}); }
function atualizarEstado(){
  if(!S.promotor||ler(LS.fila,[]).length) return;
  VC.chamar('estado',{promotorId:S.promotor.id,pin:S.promotor.pin}).then(function(r){
    if(!r.ok) return;
    S.aberta=r.aberta||null; S.hoje=r.hoje||[]; salvarLocal(); render();
  }).catch(function(){});
}
atualizarEstado();

/* ---------- localização ---------- */
function iniciarGps(){
  if(!navigator.geolocation){ S.gpsErro='Este aparelho não informa a localização.'; render(); return; }
  navigator.geolocation.watchPosition(function(p){
    S.pos={lat:p.coords.latitude,lon:p.coords.longitude,precisao:Math.round(p.coords.accuracy),t:Date.now()}; S.gpsErro=null; render();
  },function(e){
    S.gpsErro=e.code===1?'Localização bloqueada. Permita o acesso à localização para este site nas configurações do navegador.':'Não consegui pegar a localização. Vá para um lugar aberto e verifique se o GPS está ligado.';
    render();
  },{enableHighAccuracy:true,maximumAge:15000,timeout:25000});
}
iniciarGps();
function gpsTexto(){
  var el=$('gps');
  if(S.gpsErro){ el.className='gps erro'; el.querySelector('span').textContent=S.gpsErro; return; }
  if(!S.pos){ el.className='gps busca'; el.querySelector('span').textContent='Buscando sua localização…'; return; }
  el.className='gps ok';
  el.querySelector('span').textContent='Localização ativa · precisão de '+S.pos.precisao+' m';
}

/* ---------- tela ---------- */
function distLoja(l){ return S.pos?VC.distancia(S.pos.lat,S.pos.lon,l.lat,l.lon):null; }
function render(){
  telas(); if(!S.promotor) return;
  gpsTexto();
  var fila=ler(LS.fila,[]);
  $('fila').classList.toggle('oculto',!fila.length);
  $('fila').textContent=fila.length===1?'1 registro esperando internet para enviar':fila.length+' registros esperando internet para enviar';
  /* em visita */
  var v=S.aberta;
  $('cardVisita').classList.toggle('oculto',!v);
  $('cardLojas').classList.toggle('oculto',!!v);
  if(v){
    $('vLoja').textContent=v.loja;
    $('vDesde').textContent='Chegada às '+VC.hora(VC.horaOficial(v.entrada))+(v.pendente?' · enviando…':'');
  }
  /* lojas */
  var q=($('busca').value||'').trim().toLowerCase();
  var lista=S.lojas.map(function(l){ return {l:l,d:distLoja(l)}; })
    .filter(function(x){ return !q || (x.l.nome+' '+(x.l.endereco||'')).toLowerCase().indexOf(q)>=0; })
    .sort(function(a,b){ return (a.d==null?1e12:a.d)-(b.d==null?1e12:b.d) || a.l.nome.localeCompare(b.l.nome); });
  if(S.lojaSel && !lojaPorId(S.lojaSel)) S.lojaSel=null;
  if(!S.lojaSel && lista.length && lista[0].d!=null && lista[0].d<=(lista[0].l.raio||150)) S.lojaSel=lista[0].l.id;  // já marca a loja onde ele está
  $('lojas').innerHTML=lista.length?lista.map(function(x){
    var perto=x.d!=null && x.d<=(x.l.raio||150);
    return '<button type="button" class="loja'+(x.l.id===S.lojaSel?' sel':'')+'" data-id="'+VC.esc(x.l.id)+'"><span><b>'+VC.esc(x.l.nome)+'</b><small>'+VC.esc(x.l.endereco||'')+'</small></span>'+
      '<em class="dist'+(perto?' perto':'')+'">'+(x.d==null?'—':(perto?'✓ ':'')+VC.fmtDist(x.d))+'</em></button>';
  }).join(''):'<p class="vazio">Nenhuma loja encontrada.</p>';
  $('btnLojaAqui').classList.toggle('oculto',!(VC.DEMO && S.pos && !lojaPorId('L00')));
  $('btnEntrada').disabled=!(S.lojaSel && S.pos);
  var sel=lojaPorId(S.lojaSel), d=sel?distLoja(sel):null;
  if(!S.pos) aviso('msgLoja','alerta','Esperando a localização para liberar o registro.');
  else if(sel && d!=null && d>(sel.raio||150)) aviso('msgLoja','alerta','Você está a '+VC.fmtDist(d)+' de '+VC.esc(sel.nome)+'. O registro vai com alerta de distância.');
  else aviso('msgLoja');
  /* hoje */
  var hoje=S.hoje.slice().sort(function(a,b){ return new Date(VC.horaOficial(a.entrada))-new Date(VC.horaOficial(b.entrada)); });
  $('hist').innerHTML=hoje.length?hoje.map(function(h){
    var dur=h.saida?VC.duracao((new Date(VC.horaOficial(h.saida))-new Date(VC.horaOficial(h.entrada)))/60000):'em andamento';
    return '<li><span><b>'+VC.esc(h.loja)+(h.pendente?'<em class="pend">enviando</em>':'')+'</b><small>'+VC.hora(VC.horaOficial(h.entrada))+' → '+(h.saida?VC.hora(VC.horaOficial(h.saida)):'…')+'</small></span><em class="dur">'+dur+'</em></li>';
  }).join(''):'<li><p class="vazio">Nenhuma visita registrada hoje.</p></li>';
}
setInterval(function(){
  if(!S.aberta) return;
  var min=(Date.now()-new Date(VC.horaOficial(S.aberta.entrada)))/60000;
  var h=Math.floor(min/60), m=Math.floor(min%60);
  $('vTempo').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
},1000);
$('lojas').addEventListener('click',function(e){ var b=e.target.closest('.loja'); if(!b) return; S.lojaSel=b.getAttribute('data-id'); render(); });
$('busca').addEventListener('input',render);
$('btnLojaAqui').addEventListener('click',function(){
  if(!S.pos) return;
  var l=VC.demo.lojaAqui(S.pos.lat,S.pos.lon);
  if(!lojaPorId(l.id)) S.lojas.unshift(l);
  S.lojaSel=l.id; render(); toast('Loja de teste criada onde você está.');
});

/* ---------- foto e envio ---------- */
$('btnEntrada').addEventListener('click',function(){ S.modo='entrada'; abrirCamera(); });
$('btnSaida').addEventListener('click',function(){
  S.modo='saida';
  if(S.fotoSaida) abrirCamera(); else { S.foto=null; S.horaFoto=new Date(); abrirFolha(); }
});
function abrirCamera(){ $('camera').value=''; $('camera').click(); }
$('camera').addEventListener('change',function(){
  var arq=this.files&&this.files[0]; if(!arq) return;
  S.horaFoto=new Date();
  var loja=S.modo==='entrada'?lojaPorId(S.lojaSel):lojaPorId(S.aberta&&S.aberta.lojaId)||{nome:S.aberta?S.aberta.loja:''};
  var carimbo=[(S.modo==='entrada'?'CHEGADA':'SAÍDA')+' · '+S.horaFoto.toLocaleDateString('pt-BR')+' '+S.horaFoto.toLocaleTimeString('pt-BR'),
               (S.promotor?S.promotor.nome:'')+' · '+(loja?loja.nome:''),
               S.pos?('GPS '+S.pos.lat.toFixed(5)+', '+S.pos.lon.toFixed(5)+' (±'+S.pos.precisao+' m)'):'GPS indisponível'];
  carregando(true,'Preparando a foto…');
  VC.prepararFoto(arq,carimbo).then(function(url){ carregando(false); S.foto=url; abrirFolha(); })
    .catch(function(e){ carregando(false); toast(e.message); });
});
function abrirFolha(){
  var entrada=S.modo==='entrada';
  var loja=entrada?lojaPorId(S.lojaSel):(lojaPorId(S.aberta.lojaId)||{nome:S.aberta.loja});
  var d=loja&&S.pos?VC.distancia(S.pos.lat,S.pos.lon,loja.lat,loja.lon):null;
  $('fTitulo').textContent=entrada?'Confirmar chegada':'Confirmar saída';
  $('fInfo').textContent=(loja?loja.nome:'')+' · '+S.horaFoto.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(d!=null?' · '+VC.fmtDist(d)+' da loja':'');
  $('fImg').classList.toggle('oculto',!S.foto); if(S.foto) $('fImg').src=S.foto;
  $('fOutra').classList.toggle('oculto',!S.foto);
  if(d!=null && loja && d>(loja.raio||150)) aviso('fAviso','alerta','Atenção: você está a '+VC.fmtDist(d)+' da loja. O registro vai para o gestor com alerta de distância.');
  else aviso('fAviso');
  $('fObsWrap').classList.toggle('oculto',entrada); $('fObs').value='';
  $('fEnviar').textContent=entrada?'✅ Enviar chegada':'✅ Enviar saída';
  $('fEnviar').className='btn'+(entrada?'':' saida');
  $('folha').classList.add('aberta');
}
function fecharFolha(){ $('folha').classList.remove('aberta'); S.foto=null; }
$('fCancelar').addEventListener('click',fecharFolha);
$('fOutra').addEventListener('click',function(){ fecharFolha(); abrirCamera(); });
$('fEnviar').addEventListener('click',function(){
  var entrada=S.modo==='entrada', p=S.promotor;
  var dados={promotorId:p.id,pin:p.pin,hora:S.horaFoto.toISOString(),lat:S.pos?S.pos.lat:null,lon:S.pos?S.pos.lon:null,precisao:S.pos?S.pos.precisao:null,
             foto:S.foto?S.foto.split(',')[1]:''};
  var loja;
  if(entrada){ loja=lojaPorId(S.lojaSel); dados.id=VC.uuid(); dados.lojaId=loja.id; }
  else { dados.visitaId=S.aberta.id; dados.obs=$('fObs').value.trim(); }
  $('folha').classList.remove('aberta');
  carregando(true,'Enviando…');
  VC.chamar(entrada?'entrada':'saida',dados).then(function(r){
    carregando(false);
    if(!r.ok){ toast(r.erro||'Não foi possível registrar.',5000); return; }
    aplicarVisita(r.visita,entrada); S.foto=null;
    toast(entrada?'Chegada registrada às '+VC.hora(VC.horaOficial(r.visita.entrada)):'Saída registrada às '+VC.hora(VC.horaOficial(r.visita.saida)));
  }).catch(function(){
    /* sem internet: guarda e envia depois, com a hora do aparelho */
    carregando(false); dados.offline=true;
    var fila=ler(LS.fila,[]); fila.push({acao:entrada?'entrada':'saida',dados:dados}); gravar(LS.fila,fila);
    var reg={aparelho:dados.hora,offline:true,lat:dados.lat,lon:dados.lon};
    if(entrada) aplicarVisita({id:dados.id,lojaId:loja.id,loja:loja.nome,entrada:reg,saida:null,pendente:true},true);
    else aplicarVisita(Object.assign({},S.aberta,{saida:reg,pendente:true}),false);
    S.foto=null; toast('Sem internet: o registro foi guardado e será enviado sozinho.',5000);
  });
});
function aplicarVisita(v,entrada){
  var i=-1; S.hoje.forEach(function(h,k){ if(h.id===v.id) i=k; });
  if(i>=0) S.hoje[i]=v; else S.hoje.push(v);
  S.aberta=entrada?v:null; salvarLocal(); render();
}

/* ---------- envio do que ficou guardado sem internet ---------- */
var enviando=false;
function enviarFila(){
  var fila=ler(LS.fila,[]); if(enviando||!fila.length) return;
  enviando=true;
  var item=fila[0];
  VC.chamar(item.acao,item.dados).then(function(r){
    fila=ler(LS.fila,[]); fila.shift(); gravar(LS.fila,fila); enviando=false;
    if(r.ok){
      var i=-1; S.hoje.forEach(function(h,k){ if(h.id===r.visita.id) i=k; });
      if(i>=0) S.hoje[i]=r.visita;
      if(S.aberta && S.aberta.id===r.visita.id) S.aberta=r.visita.saida?null:r.visita;
      salvarLocal();
    } else toast('Um registro guardado não foi aceito: '+(r.erro||'erro'),6000);
    render(); if(!fila.length) atualizarEstado(); else enviarFila();
  }).catch(function(){ enviando=false; });
}
window.addEventListener('online',enviarFila);
setInterval(enviarFila,30000);
enviarFila();
render();
})();
</script>
</body>
</html>
